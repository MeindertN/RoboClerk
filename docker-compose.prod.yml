# ==============================================================================
# RoboClerk.Server Docker Compose - Production Overrides
# ==============================================================================
#
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file contains production-specific overrides and should be used
# in conjunction with the base docker-compose.yml file.
#
# ==============================================================================

services:
  roboclerk-server:
    # In production, use a specific image tag instead of building
    # image: ghcr.io/meindertn/roboclerk-server:${VERSION:-latest}
    
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Logging__LogLevel__Default=Warning
      - Logging__LogLevel__Microsoft=Warning
      - Logging__LogLevel__Microsoft.Hosting.Lifetime=Information
    
    # More conservative resource limits for production
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      # Restart policy
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    
    # Enhanced health check for production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    
    # Production logging - consider using a log aggregator
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        labels: "service,environment"
    labels:
      - "service=roboclerk-server"
      - "environment=production"
