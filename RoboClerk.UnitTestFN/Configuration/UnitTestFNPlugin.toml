# This is the RoboClerk UnitTest Function Name analysis plugin. Using this plugin,
# information can be extracted from the unit test source code files. This plugin 
# assumes that the test plan can be created from information extracted from the
# test function name. The test function name must follow a standard pattern
# specified in this configuration file.

# Function name mask is used to define how to parse various sections of the unit
# test description from the function name. The following element identifiers are
# supported:
# <PURPOSE> = the setup for the test, usually a short description
# <POSTCONDITION> = the successful (expected) postcondition for the test
# <IDENTIFIER> = a unique identifier for the unit test, if no unique identifier
#                is supplied, Roboclerk will generate one based on the filename
#                and line number of the test.
# <TRACEID> = a traceable link from this test to a trace entity
# <IGNORE> = a placeholder for parts of the function name to ignore.
# Example: "<PURPOSE>_VERIFIES_<POSTCONDITION>" matches
#          This_is_the_purpose_VERIFIES_that_the_test_is_good
# NOTE THAT THE FUNCTION MASK MUST START WITH AN ELEMENT IDENTIFIER

# use information in git to assign a last modified date to the test cases
UseGit = true

# TestConfigurations - New format that supports multiple configurations per project
[[TestConfigurations]]
Language = "csharp" # Language selection (one per project): csharp | java | python | typescript | javascript
TestDirectory = "{PROJECTROOT}RoboClerk.Tests" # Directory where RoboClerk should search for unit tests
SubDirs = true # Set to true to include subdirs 
FileMasks = ["Test*.cs"] # Set the filemasks that will be used to match files
Project = "RoboClerk" # Project identifier for this configuration
FunctionMask = "<PURPOSE>_VERIFIES_<POSTCONDITION>"
SectionSeparator = "_"
# As spaces are not allowed in function names, a system must be used to separate
# the words in each section. For this configuration one or more separator 
# characters can be indicated (e.g. this_is_not_camel_case with separator _) or
# CAMELCASE for a camelcase (e.g. thisIsCamelCase) based approach.

# ==============================================================================
# Git Repository Source Example
# ==============================================================================
# Instead of using TestDirectory for a local path, you can clone source code
# directly from a Git repository. This is useful when:
# - Running RoboClerk in Docker/CI where source code isn't locally available
# - Analyzing tests from external repositories
# - Pinning analysis to a specific branch, tag, or commit
#
# Note: You must specify EITHER TestDirectory OR GitSource, not both.
#
# [[TestConfigurations]]
# Language = "csharp"
# SubDirs = true
# FileMasks = ["Test*.cs", "*Tests.cs"]
# Project = "ExternalLibrary"
# FunctionMask = "<PURPOSE>_VERIFIES_<POSTCONDITION>"
# SectionSeparator = "_"
# 
# [TestConfigurations.GitSource]
# # Required: The repository URL (HTTPS format recommended for token auth)
# RepositoryUrl = "https://github.com/company/external-library.git"
# 
# # Optional: Specify what to checkout (in order of precedence: CommitSha > Tag > Branch)
# # If none specified, the default branch is used
# Branch = "main"                    # Branch name
# # Tag = "v1.2.3"                   # Or a specific tag
# # CommitSha = "abc123def456"       # Or a specific commit SHA (full or short)
# 
# # Optional: Path within the repository to scan (empty = entire repo)
# SourcePath = "tests/unit"
# 
# # Authentication (required for private repositories)
# # Supported methods: "none" (public repos), "token", "basic"
# AuthMethod = "token"
# 
# # The credential key - matches the environment variable name from docker-compose
# # This is looked up from:
# # 1. Environment variables (highest priority)
# # 2. Server configuration (for RoboClerk Server)
# # Supported keys: GIT_GITHUB_TOKEN, GIT_GITLAB_TOKEN, GIT_AZURE_DEVOPS_PAT, GIT_BITBUCKET_TOKEN
# CredentialKey = "GIT_GITHUB_TOKEN"
# 
# # Optional: Performance settings
# ShallowClone = true               # Use shallow clone (depth=1) for faster cloning
# TimeoutSeconds = 300              # Clone timeout in seconds







